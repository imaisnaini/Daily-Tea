[versions]
agp = "9.2.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
lifecycleViewmodelKtx = "2.11.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
